services:
  # ── Backend (compiled Node.js) ─────────────────────────────────────────────
  # MongoDB is provided externally via MONGO_URI (MongoDB Atlas recommended).
  # No local mongo container — set MONGO_URI in your .env or deployment config.
  backend:
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
      APP_BASE_URL: ${APP_BASE_URL}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-"HEALTH AI" <noreply@healthai.com>}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
    ports:
      - "5000:5000"

  # ── Frontend (nginx static + API proxy) ───────────────────────────────────
  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_URL: /api    # nginx proxies /api → backend:5000/api
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - backend
